<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vetomy — Comparative Veterinary Anatomy</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🦴</span>
      <span class="brand-name">Vetomy</span>
      <small>Comparative Veterinary Anatomy</small>
    </div>
    <nav id="species-tabs" class="species-tabs"></nav>
  </header>

  <aside class="sidebar left">
    <input id="search" type="search" placeholder="Search bones… / ابحث عن عظمة">
    <div class="filters" id="region-filters"></div>
    <ul id="bone-list" class="bone-list"></ul>
  </aside>

  <main id="viewer">
    <div id="tooltip" class="tooltip hidden"></div>
    <div id="loading" class="loading hidden">Loading model…</div>
    <div id="placeholder-badge" class="badge hidden">Placeholder model — waiting for the real GLB file</div>
    <div class="toolbar">
      <label class="explode">Explode
        <input id="explode" type="range" min="0" max="1" step="0.01" value="0">
      </label>
      <button id="ghost-btn" class="toggle on" title="Make other bones transparent when one is selected">Ghost others</button>
      <button id="reset-btn">Reset view</button>
    </div>
  </main>

  <aside class="sidebar right" id="info-panel"></aside>

  <script type="module" src="app.js"></script>
</body>
</html>
