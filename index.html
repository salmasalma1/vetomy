<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c1411">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <title>Vetomy — Interactive Veterinary Anatomy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20261118k">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>

  <!-- Top bar -->
  <header class="topbar">
    <div class="logo">vetomy<span class="logo-dot"></span><span class="tag-3d">3D</span></div>

    <div class="search-wrap">
      <label class="search" for="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search bones" autocomplete="off" aria-controls="results">
        <kbd>/</kbd>
      </label>
      <ul id="results" class="results hidden" role="listbox"></ul>
    </div>

    <button id="theme-btn" class="icon-btn" aria-label="Toggle dark mode">
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <!-- Species index -->
  <nav id="species" class="species" aria-label="Species"></nav>

  <!-- Regions -->
  <div class="regions">
    <p class="regions-label">Regions</p>
    <div id="region-chips" class="chips"></div>
    <p id="visible-count" class="visible-count"></p>
  </div>

  <!-- Landmark points on the selected bone -->
  <div id="lm-layer" class="lm-layer" aria-live="polite"></div>
  <div id="lm-pop" class="lm-pop hidden" role="dialog"></div>

  <!-- Landmark editor (open the site with ?edit) -->
  <div id="lm-editbar" class="lm-editbar hidden">
    <span><strong>Landmark editor</strong> Select a bone, then click on it to add a point.</span>
    <button id="lm-export" class="pill">Export JSON</button>
    <button id="lm-discard" class="pill">Discard drafts</button>
  </div>
  <form id="lm-editor" class="lm-editor hidden" autocomplete="off">
    <label for="lm-name">Name this point</label>
    <input id="lm-name" list="lm-suggest" placeholder="e.g. Greater tubercle" required>
    <datalist id="lm-suggest"></datalist>
    <div class="lm-editor-actions">
      <button type="button" id="lm-cancel" class="pill">Cancel</button>
      <button type="submit" class="pill on">Save point</button>
    </div>
  </form>

  <!-- Info sheet -->
  <aside id="info-panel" class="sheet hidden" aria-live="polite"></aside>

  <!-- Dock -->
  <div class="dock" role="toolbar" aria-label="Viewer controls">
    <div class="views">
      <button data-view="three" class="active" title="Three-quarter view">3/4</button>
      <button data-view="right" title="Right lateral">Lat R</button>
      <button data-view="left" title="Left lateral">Lat L</button>
      <button data-view="cranial" title="Cranial view">Cr</button>
      <button data-view="dorsal" title="Dorsal view">D</button>
    </div>
    <span class="sep"></span>
    <label class="explode">
      <span>Explode</span>
      <input id="explode" type="range" min="0" max="100" step="1" value="0">
      <output id="explode-val">0%</output>
    </label>
    <span class="sep"></span>
    <button id="ghost-btn" class="pill on" aria-pressed="true">Ghost</button>
    <button id="spin-btn" class="icon-btn small" title="Auto-rotate" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button id="reset-btn" class="icon-btn small" title="Reset view">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
    </button>
  </div>

  <!-- Real specimen view (replaces the skeleton in the stage) -->
  <section id="specimen-view" class="specimen-view hidden" aria-labelledby="specimen-title">
    <div class="specimen-bar">
      <button id="specimen-back" class="back-btn">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        Back to skeleton
      </button>
      <div class="specimen-heading">
        <p class="specimen-kicker">Real specimen</p>
        <h3 id="specimen-title"></h3>
      </div>
      <a id="specimen-credit" class="specimen-credit" target="_blank" rel="noopener"></a>
    </div>
    <div class="specimen-frame">
      <div id="specimen-loading" class="specimen-loading">Loading high-resolution scan…</div>
      <div id="specimen-canvas" class="specimen-canvas hidden"></div>
      <div id="specimen-landmarks" class="landmarks hidden">
        <p class="lm-head">Landmarks <span>translated from Spanish</span></p>
        <ol id="lm-list"></ol>
      </div>
      <iframe id="specimen-frame" title="Real specimen 3D scan" allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
    </div>
  </section>

  <p id="placeholder-badge" class="badge hidden">Placeholder model</p>
  <p id="model-credit" class="model-credit"></p>
  <div id="tooltip" class="tooltip hidden"></div>
  <div id="toast" class="toast"></div>

  <!-- Shows a readable message if the app fails to start -->
  <script>
    (function () {
      function show(msg) {
        if (document.getElementById('error-box')) return;
        var box = document.createElement('div');
        box.id = 'error-box';
        box.className = 'error-box';
        box.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;max-width:520px;padding:20px 22px;background:#fff;color:#12201b;border:1.5px solid #ff6b3d;border-radius:20px;font-family:system-ui,sans-serif;line-height:1.55;';
        box.innerHTML = '<strong>Vetomy couldn\u2019t start</strong>' +
          'Check your internet connection (the 3D library loads online). ' +
          'If you opened index.html by double-clicking it, run it through a local server instead.' +
          '<code></code>';
        box.querySelector('code').textContent = msg;
        document.body.appendChild(box);
      }
      window.addEventListener('error', function (e) {
        if (e instanceof ErrorEvent) show(e.message);
        else if (e.target && e.target.tagName === 'SCRIPT') show('Failed to load ' + (e.target.src || 'a script'));
      }, true);
      window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
      window.__vetomyShowError = show;
      setTimeout(function () { if (!window.__vetomyReady) show('The app did not finish loading within 15 seconds.'); }, 15000);
    })();
  </script>
  <script type="module" src="assets/js/app.js?v=20261118k"></script>
</body>
</html>
